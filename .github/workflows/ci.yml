name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package
        run: python -m pip install -e ".[dev]"

      - name: Run unit tests
        run: python -m unittest discover -s tests

      - name: Confirm HIGH-or-above gate triggers
        run: |
          set +e
          python -m cloud_misconfig_scanner --fixture examples/aws_responses.sample.json --fail-on HIGH
          exit_code=$?
          set -e

          if [ "$exit_code" -eq 2 ]; then
            echo "Scanner gate triggered as expected for HIGH-or-above findings."
            exit 0
          fi

          echo "Expected scanner gate to exit 2, but got $exit_code."
          exit 1
